    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://pwypezikutjneesnevnv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3eXBlemlrdXRqbmVlc25ldm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzE3NzYsImV4cCI6MjA5MjUwNzc3Nn0.ufITq5TJBz3RLYVoNyy_S30EZbAZxrn-WU5CAOrxtpQ';
        const SUPABASE_TABLE_NAME = 'products';
        const bestsellerRow = document.getElementById('landing_bestseller_row');
        const landingFeaturesRow = document.getElementById('landing_features_row');
        const highlightManifestUrl = 'img/highlights/manifest.json';

        function createFeatureCard(videoSrc, captionText) {
            const card = document.createElement('div');
            card.className = 'landing_feature_card';

            const caption = String(captionText || videoSrc.split('/').pop().replace(/\.mp4$/, '').replace(/[-_]/g, ' '));

            card.innerHTML = `
                <video controls preload="metadata" muted playsinline>
                    <source src="${videoSrc}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="landing_feature_card_caption">${caption}</div>
            `;

            return card;
        }

        async function renderFeatureVideos() {
            if (!landingFeaturesRow) return;
            landingFeaturesRow.innerHTML = '<p class="landing_status">Loading highlights...</p>';

            try {
                const response = await fetch(highlightManifestUrl, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to load highlight manifest: ${response.status} ${response.statusText}`);
                }

                const manifest = await response.json();
                if (!Array.isArray(manifest)) {
                    throw new Error('Highlight manifest must be an array');
                }

                landingFeaturesRow.innerHTML = '';
                manifest.forEach(item => {
                    const videoSrc = `img/highlights/${item.file}`;
                    landingFeaturesRow.appendChild(createFeatureCard(videoSrc, item.caption));
                });
            } catch (error) {
                console.error('Failed to load highlight videos:', error);
                landingFeaturesRow.innerHTML = '<p class="landing_status">Unable to load highlights right now.</p>';
            }
        }

        function isTruthyFlag(value) {
            return ['yes', 'true', '1', 'y', 'on'].includes(String(value ?? '').trim().toLowerCase());
        }

        function normalizeProductRow(row) {
            return {
                id: Number(row.id) || 0,
                name: String(row.name || row.product_name || row.title || ''),
                price: Number(row.price ?? row.Price ?? 0) || 0,
                category: String(row.category || 'Uncategorized'),
                bimg: String(row.bimg || row.image || ''),
                bestseller: isTruthyFlag(row.bestseller) || isTruthyFlag(row.bestselling) || isTruthyFlag(row.bestSeller) || isTruthyFlag(row.best_selling),
                outOfStock: isTruthyFlag(row.outofstock) || isTruthyFlag(row.out_of_stock) || isTruthyFlag(row.outOfStock)
            };
        }

        function createBestsellerCard(product) {
            const card = document.createElement('div');
            card.className = 'card bestseller-card landing_bestseller_card';

            const outOfStock = Boolean(product.outOfStock);
            const ribbonHtml = '<img class="bestseller-ribbon" src="img/icon/BestSellingv3.gif" alt="Best Selling">';
            const watermarkHtml = outOfStock ? '<div class="out-of-stock-watermark">Out of Stock</div>' : '';
            const imageClass = outOfStock ? 'card-image out-of-stock-image' : 'card-image';
            const buttonHtml = outOfStock
                ? '<button disabled style="top: -50px; right: -45px; position: relative;">Out of stock</button>'
                : '<button onclick="window.location.href=\'/shop\'" style="top: -50px; right: -45px; position: relative;">View in Shop</button>';

            card.innerHTML = `
                
                <div class="${imageClass}" style="position: relative; background-image: url(${product.bimg}); background-size: cover; background-repeat: no-repeat; border-radius:15px;">
                    ${watermarkHtml}
                </div>
                <h3 style="font-size: 14px; position: relative; top: 0px; left: 10px; margin: 0px; padding-bottom: 10px; color: var(--brown); width: 150px;">${product.name}</h3>
                <strong style="position: relative; top: -31px; left: 110px; margin: 0px; padding-bottom: 10px; color: var(--brown); width: 150px;">₱ ${product.price}</strong>
                <br>
                <div style="position: relative; top: -38px; right:15px;">
                    ${buttonHtml}
                </div>
                
            `;

            return card;
        }

        async function loadBestSellers() {
            if (!bestsellerRow) return;

            bestsellerRow.innerHTML = '<p class="landing_status">Loading featured products...</p>';

            try {
                const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await supabase.from(SUPABASE_TABLE_NAME).select('*').limit(1000);

                if (error) throw error;

                const products = (Array.isArray(data) ? data : []).map(normalizeProductRow);
                const bestsellers = products
                    .filter(product => product.bestseller)
                    .sort((left, right) => (left.id || 0) - (right.id || 0))
                    .slice(0, 6);

                if (!bestsellers.length) {
                    bestsellerRow.innerHTML = '<p class="landing_status">No featured products found.</p>';
                    return;
                }

                bestsellerRow.innerHTML = '';
                bestsellers.forEach(product => {
                    bestsellerRow.appendChild(createBestsellerCard(product));
                });
            } catch (error) {
                console.error('Failed to load featured products:', error);
                bestsellerRow.innerHTML = '<p class="landing_status">Unable to load featured products right now.</p>';
            }
        }

        loadBestSellers();
        renderFeatureVideos();
    </script>

    <script>
        try {
            // Get today's date
            const today = new Date();

            // Format date as YYYY-MM-DD
            const formattedDate = today.toLocaleDateString(undefined, { 
             year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
            });


            // Insert into HTML element
            document.getElementById('today').textContent = formattedDate;
        } catch (error) {
            console.error("Error displaying date:", error);
            document.getElementById('today').textContent = "Unable to load date";
        }
    </script>

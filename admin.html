<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Data Center</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #3f362f;
      --accent: #7b5f4a;
      --border: #dccfc3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f6f4ef, #eee5dc);
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(44, 31, 20, 0.08);
    }

    .pin-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(63, 54, 47, 0.5);
      z-index: 50;
    }

    .pin-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: 0 10px 28px rgba(44, 31, 20, 0.16);
    }

    .pin-card h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .pin-card p {
      margin: 0 0 12px;
    }

    .pin-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .pin-error {
      margin-top: 10px;
      color: #9a3030;
      font-size: 0.92rem;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .hint {
      margin: 0 0 14px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 14px 0 12px;
    }

    .table-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .table-btn.active {
      background: #4f3b2b;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    #status {
      min-height: 20px;
      margin: 0;
      font-size: 0.92rem;
    }

    #status.error {
      color: #9a3030;
    }

    #status.ok {
      color: #2a6f3f;
    }

    .table-wrap {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      max-height: 70vh;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee4db;
      border-right: 1px solid #eee4db;
      font-size: 0.92rem;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8efe6;
      font-weight: 700;
    }

    tbody tr:nth-child(even) td {
      background: #fffdf9;
    }

    .empty {
      padding: 14px;
      color: #6d5b4f;
    }

    @media (max-width: 760px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="pin-modal" id="pinModal" aria-modal="true" role="dialog">
    <div class="pin-card">
      <h2>Admin Access</h2>
      <p>Enter the 6-digit admin PIN to unlock the viewer.</p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter 6-digit PIN">
      <button id="pinSubmit" type="button">Unlock Admin</button>
      <p id="pinError" class="pin-error" hidden>Incorrect PIN. Please try again.</p>
    </div>
  </div>

  <main id="adminMain" hidden>
    <section class="panel">
      <h1>Admin Viewer</h1>
      <p class="hint">Choose a Supabase table to inspect. The page loads the queue table by default when opened.</p>

      <div class="toolbar">
        <div class="table-switcher" id="tableSwitcher">
          <button class="table-btn active" data-table="queue" type="button">queue</button>
          <button class="table-btn" data-table="products" type="button">products</button>
          <button class="table-btn" data-table="cost" type="button">cost</button>
          <button class="table-btn" data-table="orders" type="button">orders</button>
          <button class="table-btn" data-table="profits" type="button">profits</button>
        </div>
        <p id="status">Loading queue table...</p>
      </div>

      <div class="table-wrap">
        <table id="dataTable" aria-label="Admin data table"></table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    const STATUS_EL = document.getElementById('status');
    const TABLE_EL = document.getElementById('dataTable');
    const TABLE_SWITCHER = document.getElementById('tableSwitcher');
    const TABLE_BUTTONS = Array.from(document.querySelectorAll('.table-btn'));
    const PIN_MODAL = document.getElementById('pinModal');
    const PIN_INPUT = document.getElementById('pinInput');
    const PIN_SUBMIT = document.getElementById('pinSubmit');
    const PIN_ERROR = document.getElementById('pinError');
    const ADMIN_MAIN = document.getElementById('adminMain');

    const SUPABASE_URL = 'https://pwypezikutjneesnevnv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3eXBlemlrdXRqbmVlc25ldm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzE3NzYsImV4cCI6MjA5MjUwNzc3Nn0.ufITq5TJBz3RLYVoNyy_S30EZbAZxrn-WU5CAOrxtpQ';
    const DEFAULT_TABLE = 'queue';
    const ADMIN_PIN = '286586';

    function normalizeTableName(tableName) {
      return String(tableName || '').trim().toLowerCase();
    }

    function setStatus(message, cls) {
      if (!STATUS_EL) return;
      STATUS_EL.textContent = message;
      STATUS_EL.className = cls || '';
    }

    function setActiveTableButton(tableName) {
      const normalized = normalizeTableName(tableName);

      TABLE_BUTTONS.forEach((button) => {
        const isActive = normalizeTableName(button.dataset.table) === normalized;
        button.classList.toggle('active', isActive);
      });
    }

    function showPinError(message) {
      if (!PIN_ERROR) return;
      PIN_ERROR.hidden = false;
      PIN_ERROR.textContent = message;
    }

    function unlockAdmin() {
      const enteredPin = String(PIN_INPUT?.value || '').trim();

      if (enteredPin !== ADMIN_PIN) {
        showPinError('Incorrect PIN. Please try again.');
        if (PIN_INPUT) {
          PIN_INPUT.value = '';
          PIN_INPUT.focus();
        }
        return;
      }

      if (PIN_MODAL) {
        PIN_MODAL.hidden = true;
        PIN_MODAL.style.display = 'none';
        PIN_MODAL.setAttribute('aria-hidden', 'true');
      }

      if (PIN_ERROR) {
        PIN_ERROR.hidden = true;
      }

      if (ADMIN_MAIN) {
        ADMIN_MAIN.hidden = false;
      }

      loadTableFromSupabase(DEFAULT_TABLE);
    }

    function createSupabaseClient() {
      return supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: {
          fetch: (...args) => fetch(...args, { cache: 'no-store' })
        }
      });
    }

    function renderTable(rows, tableName) {
      if (!TABLE_EL) return;

      TABLE_EL.innerHTML = '';

      if (!Array.isArray(rows) || !rows.length) {
        TABLE_EL.innerHTML = '<tbody><tr><td class="empty">No rows found in the ' + tableName + ' table.</td></tr></tbody>';
        return;
      }

      const headerKeys = Object.keys(rows[0]);
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      headerKeys.forEach((key) => {
        const th = document.createElement('th');
        th.textContent = key;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      TABLE_EL.appendChild(thead);

      const tbody = document.createElement('tbody');
      rows.forEach((row) => {
        const tr = document.createElement('tr');

        headerKeys.forEach((key) => {
          const td = document.createElement('td');
          const rawValue = row[key];
          td.textContent = rawValue === null || rawValue === undefined ? '' : String(rawValue);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      TABLE_EL.appendChild(tbody);
    }

    async function loadTableFromSupabase(tableName) {
      const normalizedName = normalizeTableName(tableName);
      setStatus('Loading ' + normalizedName + ' table...', '');
      setActiveTableButton(normalizedName);

      try {
        const supabaseClient = createSupabaseClient();
        let query = supabaseClient
          .from(normalizedName)
          .select('*')
          .limit(1000);

        if (normalizedName === 'orders') {
          query = query.order('Submitted Date', { ascending: false });
        }

        const { data, error } = await query;

        if (error) {
          throw error;
        }

        const rows = Array.isArray(data) ? data : [];
        renderTable(rows, normalizedName);
        setStatus('Loaded ' + rows.length + ' rows from ' + normalizedName, 'ok');
      } catch (error) {
        console.error('Failed to fetch table:', error);
        setStatus('Failed to load ' + normalizedName + ' table: ' + error.message, 'error');
      }
    }

    if (PIN_INPUT) {
      PIN_INPUT.addEventListener('input', () => {
        PIN_INPUT.value = PIN_INPUT.value.replace(/\D/g, '').slice(0, 6);
        if (PIN_ERROR) {
          PIN_ERROR.hidden = true;
        }
      });

      PIN_INPUT.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          unlockAdmin();
        }
      });
    }

    if (PIN_SUBMIT) {
      PIN_SUBMIT.addEventListener('click', unlockAdmin);
    }

    if (TABLE_SWITCHER) {
      TABLE_SWITCHER.addEventListener('click', (event) => {
        const target = event.target.closest('.table-btn');
        if (!target) return;

        loadTableFromSupabase(target.dataset.table);
      });
    }

    PIN_INPUT?.focus();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Source Viewer</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #3f362f;
      --accent: #7b5f4a;
      --border: #dccfc3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f6f4ef, #eee5dc);
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(44, 31, 20, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .hint {
      margin: 0 0 14px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      min-height: 20px;
      margin: 6px 0 0;
      font-size: 0.92rem;
    }

    #status.error {
      color: #9a3030;
    }

    #status.ok {
      color: #2a6f3f;
    }

    .table-wrap {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      max-height: 70vh;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee4db;
      border-right: 1px solid #eee4db;
      font-size: 0.92rem;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8efe6;
      font-weight: 700;
    }

    tr:nth-child(even) td {
      background: #fffdf9;
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <h1>Admin Data Viewer</h1>
      <div style="height:12px"></div>
      <h2 style="margin:12px 0 6px;font-size:1.1rem;">Supabase Table Viewer</h2>
      <p id="status">Loading Supabase table automatically...</p>

      <div class="table-wrap">
        <table id="excelTable" aria-label="Excel data table"></table>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="admin.js"></script>
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    // Supabase table loader and renderer
    const STATUS_EL = document.getElementById('status');

    function setStatus(message, cls) {
      if (!STATUS_EL) return;
      STATUS_EL.textContent = message;
      STATUS_EL.className = cls || '';
    }

    function renderTableFromRows(rows) {
      const table = document.getElementById('excelTable');
      table.innerHTML = '';
      if (!rows || !rows.length) {
        table.innerHTML = '<tr><td style="padding:12px">No rows found</td></tr>';
        return;
      }
      // Build header from keys of first row
      const headerRow = document.createElement('tr');
      const keys = Object.keys(rows[0]);
      keys.forEach(k => {
        const th = document.createElement('th');
        th.textContent = k;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      rows.forEach(r => {
        const tr = document.createElement('tr');
        keys.forEach(k => {
          const td = document.createElement('td');
          let v = r[k];
          if (v === null || v === undefined) v = '';
          td.textContent = String(v);
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    const SUPABASE_URL = 'https://pwypezikutjneesnevnv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3eXBlemlrdXRqbmVlc25ldm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzE3NzYsImV4cCI6MjA5MjUwNzc3Nn0.ufITq5TJBz3RLYVoNyy_S30EZbAZxrn-WU5CAOrxtpQ';
    const SUPABASE_TABLE_NAME = 'products';

    async function loadFromSupabase() {
      setStatus('Connecting to Supabase...', '');
      try {
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await supabaseClient.from(SUPABASE_TABLE_NAME).select('*').limit(1000);
        if (error) {
          console.error('Supabase error', error);
          setStatus('Supabase error: ' + error.message, 'error');
          return;
        }
        renderTableFromRows(data || []);
        setStatus('Loaded ' + (data ? data.length : 0) + ' rows', 'ok');
      } catch (err) {
        console.error(err);
        setStatus('Failed to fetch from Supabase: ' + err.message, 'error');
      }
    }

    loadFromSupabase();
  </script>
</body>

</html>
